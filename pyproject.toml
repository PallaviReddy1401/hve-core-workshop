[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smartassist"
version = "0.1.0"
description = "SmartAssist customer support conversation service"
requires-python = ">=3.11"
dependencies = [
  "azure-identity>=1.19,<2",
  "fastapi>=0.115,<1",
  "openai>=1.65,<3",
  "pydantic-settings>=2.7,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/smartassist"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

